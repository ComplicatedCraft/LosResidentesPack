# Servidor de Los Residentes (itzg/minecraft-server) + copias automáticas + SFTP.
# Lo instala install.sh; a mano: crea un .env con SFTP_PASSWORD=... y `docker compose up -d`.
#
#   Juego:    <ip>:25565
#   SFTP:     sftp://<ip>:2222          (usuario admin; contraseña en .env)
#   Log:      docker compose logs -f minecraft
#   Comando:  docker exec minecraft rcon-cli say hola
#   Reiniciar (y actualizar los mods): docker compose restart minecraft
services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft
    restart: unless-stopped
    # Al apagar el PC, la imagen manda `stop` y espera a que guarde. Docker solo da 10 s por
    # defecto; 80 s caben en los 90 s que systemd le da a Docker para cerrar.
    stop_grace_period: 80s
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.266"   # si cambia en pack.toml, cámbialo aquí
      PACKWIZ_URL: https://losresidentespack.pages.dev/pack.toml
      MEMORY: 6G
      ONLINE_MODE: "FALSE"           # authlogic verifica a los premium y pide llave a los demás
      TZ: Europe/Madrid
      RCON_PASSWORD: ${SFTP_PASSWORD:?Falta SFTP_PASSWORD en .env}
    ports:
      - "25565:25565"       # Minecraft
      - "25565:25565/udp"   # Sable (barcos/aviones de Aeronautics)
      - "8100:8100"         # BlueMap (mapa web)
      - "3876:3876"         # Create Track Map (trenes en BlueMap y su propio mapa)
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
    networks:
      default:
        aliases: [crafty]   # para túneles creados cuando el stack usaba Crafty (crafty:25565...)

  # Copia del mundo cada 6 h (deja los .jar fuera: los vuelve a bajar packwiz) y borra las de más de 3 días.
  backups:
    image: itzg/mc-backup
    container_name: backups
    restart: unless-stopped
    environment:
      RCON_HOST: minecraft
      RCON_PASSWORD: ${SFTP_PASSWORD}
      BACKUP_INTERVAL: 6h
      PRUNE_BACKUPS_DAYS: 3
      INITIAL_DELAY: 5m
      TZ: Europe/Madrid
    volumes:
      - ./data:/data:ro
      - ./backups:/backups

  sftp:
    image: atmoz/sftp:alpine
    container_name: sftp
    restart: unless-stopped
    ports:
      - "2222:22"
    volumes:
      - ./data:/home/admin/servidor
      - ./backups:/home/admin/backups:ro
    command: "admin:${SFTP_PASSWORD:?Falta SFTP_PASSWORD en .env}:1000:1000"

  # Cloudflare Tunnel (opcional). Solo arranca si .env tiene COMPOSE_PROFILES=tunnel y CF_TUNNEL_TOKEN.
  # Las rutas se configuran en Cloudflare Zero Trust: tcp://minecraft:25565, http://minecraft:8100 y
  # http://minecraft:3876 (ruta /api del mapa). Ver README.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}

  # Copia a Google Drive de la ULTIMA copia (opcional). Solo arranca con COMPOSE_PROFILES=drive
  # (o tunnel,drive) y un rclone/rclone.conf con un remoto "drive". Cada hora mira si hay una copia nueva y
  # la sube como un unico archivo (ultimo-backup.tar.gz), sustituyendo a la anterior. Ver README, "Copia a Google Drive".
  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    profiles: ["drive"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - RCLONE_CONFIG=/config/rclone.conf
      - DRIVE_DEST=${DRIVE_DEST:-drive:LosResidentes}
    volumes:
      - ./backups:/backups:ro
      - ./rclone:/config
    command:
      - |
        while true; do
          # la mas reciente que lleve 5+ min sin tocarse (asi no subimos una a medio escribir)
          f=$$(find /backups -name '*.tar.gz' -mmin +5 | xargs -r ls -t | head -1)
          if [ -n "$$f" ]; then
            id="$$f $$(stat -c %Y "$$f")"
            if [ "$$id" != "$$(cat /config/ultimo 2>/dev/null)" ]; then
              echo "Subiendo $$f"
              rclone copyto "$$f" "$$DRIVE_DEST/ultimo-backup.tar.gz" --drive-chunk-size 64M \
                && echo "$$id" > /config/ultimo && echo "Subido."
            fi
          fi
          sleep 3600
        done
