# Servidor de Los Residentes con panel web (Crafty Controller) + SFTP.
# Lo instala install.sh; a mano: crea un .env con SFTP_PASSWORD=... y `docker compose up -d`.
#
#   Panel:  https://<ip>:8443          (usuario admin; contraseña inicial en crafty/config/default-creds.txt)
#   SFTP:   sftp://<ip>:2222           (usuario admin; contraseña en .env)
#   Juego:  <ip>:25565
services:
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    container_name: crafty
    restart: unless-stopped
    # Al apagar el PC, Crafty manda `stop` al servidor y espera a que guarde. Docker solo da 10 s
    # por defecto; 80 s caben en los 90 s que systemd le da a Docker para cerrar.
    stop_grace_period: 80s
    environment:
      - TZ=Europe/Madrid
    ports:
      - "8443:8443"         # panel web (HTTPS)
      - "25565:25565"       # Minecraft
      - "25565:25565/udp"   # Sable (barcos/aviones de Aeronautics)
      - "8100:8100"         # BlueMap (mapa web)
      - "3876:3876"         # Create Track Map (trenes en BlueMap y su propio mapa)
    volumes:
      - ./crafty/backups:/crafty/backups
      - ./crafty/logs:/crafty/logs
      - ./crafty/servers:/crafty/servers
      - ./crafty/config:/crafty/app/config
      - ./crafty/import:/crafty/import

  sftp:
    image: atmoz/sftp:alpine
    container_name: sftp
    restart: unless-stopped
    ports:
      - "2222:22"
    volumes:
      - ./crafty/servers:/home/admin/servidores
      - ./crafty/backups:/home/admin/backups:ro
      - ./crafty/import:/home/admin/importar
    command: "admin:${SFTP_PASSWORD:?Falta SFTP_PASSWORD en .env}:1000:1000"

  # Cloudflare Tunnel (opcional). Solo arranca si .env tiene COMPOSE_PROFILES=tunnel y CF_TUNNEL_TOKEN.
  # Las rutas (panel, juego, mapa) se configuran en el panel de Cloudflare Zero Trust apuntando a
  # https://crafty:8443, tcp://crafty:25565, http://crafty:8100 y http://crafty:3876 (ruta /api del mapa). Ver README.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:-}

  # Copia a Google Drive del ULTIMO backup de Crafty (opcional). Solo arranca con COMPOSE_PROFILES=drive
  # (o tunnel,drive) y un rclone/rclone.conf con un remoto "drive". Cada hora mira si hay un backup nuevo y
  # lo sube como un unico archivo (ultimo-backup.zip), sustituyendo al anterior. Ver README, "Copia a Google Drive".
  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    profiles: ["drive"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - RCLONE_CONFIG=/config/rclone.conf
      - DRIVE_DEST=${DRIVE_DEST:-drive:LosResidentes}
    volumes:
      - ./crafty/backups:/backups:ro
      - ./rclone:/config
    command:
      - |
        while true; do
          # el mas reciente que lleve 5+ min sin tocarse (asi no subimos uno a medio escribir)
          f=$$(find /backups -name '*.zip' -mmin +5 | xargs -r ls -t | head -1)
          if [ -n "$$f" ]; then
            id="$$f $$(stat -c %Y "$$f")"
            if [ "$$id" != "$$(cat /config/ultimo 2>/dev/null)" ]; then
              echo "Subiendo $$f"
              rclone copyto "$$f" "$$DRIVE_DEST/ultimo-backup.zip" --drive-chunk-size 64M \
                && echo "$$id" > /config/ultimo && echo "Subido."
            fi
          fi
          sleep 3600
        done
